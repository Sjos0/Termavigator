name: Build Termavigator

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  compile:
    name: Compilar código Kotlin (sem assinatura)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Compilar debug e release (Kotlin, sem empacotar)
        shell: bash
        run: |
          set +e
          gradle :app:compileDebugKotlin :app:compileReleaseKotlin --no-daemon > build-output.txt 2>&1
          code=$?
          { grep -E '^e: |^w: ' build-output.txt | head -40; grep -A4 'What went wrong' build-output.txt | head -20; } | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit $code

      - name: Testes do protocolo de ferramentas
        shell: bash
        run: gradle :app:testDebugUnitTest --tests "com.example.devmode.*" --no-daemon
